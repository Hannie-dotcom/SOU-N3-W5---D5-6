<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soumatome N3 Kanji - Tuần 5 (Ngày 5-6)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: linear-gradient(rgba(255, 245, 247, 0.75), rgba(240, 220, 225, 0.85)),
                        url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 12px;
            overflow-x: hidden;
        }

        .sakura-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .petal {
            position: absolute; background: #ffb7c5; border-radius: 15px 0 15px 0; opacity: 0.75;
            filter: drop-shadow(0 2px 4px rgba(216, 90, 127, 0.2)); animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translate(0, -10px) rotate(0deg); opacity: 0.8; }
            100% { transform: translate(80px, 105vh) rotate(360deg); opacity: 0; }
        }

        .app-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 20px 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(180, 100, 120, 0.15);
            margin-top: 10px;
            margin-bottom: 20px;
        }

        /* Tiêu đề Căn Giữa Dàn Đều */
        .main-title-block {
            text-align: center;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 2px dashed #f2d5db;
        }
        .main-title-sub {
            font-size: 11px;
            color: #b06d7e;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .main-title-kanji {
            color: #d85a7f;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #b06d7e; margin-bottom: 8px; }

        /* Progress Bar */
        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #f2d5db;
            border-radius: 10px;
            margin-bottom: 14px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e07a9e, #d85a7f);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* Setup Panel */
        .setup-panel { display: flex; flex-direction: column; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: 700; color: #d85a7f; }
        select {
            width: 100%; padding: 12px; border: 1.5px solid #f2d5db; border-radius: 12px;
            font-size: 15px; outline: none; background: #fff5f7; color: #3a2e30; font-weight: 600;
        }

        /* Question Card */
        .question-card {
            background: #fff5f7;
            border-left: 4px solid #d85a7f;
            padding: 24px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
        .q-word { font-size: 32px; font-weight: 700; color: #3a2e30; word-break: break-all; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .opt-btn {
            display: flex; align-items: center; justify-content: center; background: #ffffff;
            border: 1.5px solid #f2d5db; color: #4a383b; padding: 14px 8px; border-radius: 12px;
            font-size: 16px; font-weight: 700; cursor: pointer; text-align: center; line-height: 1.3;
        }
        .opt-btn:active { background: #fff0f3; border-color: #d85a7f; }
        .opt-btn.correct { background: #e8f5e9 !important; border-color: #66bb6a !important; color: #2e7d32 !important; }
        .opt-btn.wrong { background: #ffebee !important; border-color: #ef5350 !important; color: #c62828 !important; }

        /* Explanation Box */
        .explanation-box { background: #ffffff; border: 1px dashed #d85a7f; border-radius: 12px; padding: 12px; margin-top: 12px; }
        .exp-title { font-size: 11px; font-weight: 700; color: #d85a7f; text-transform: uppercase; margin-bottom: 4px; }
        .exp-detail { font-size: 15px; font-weight: 700; color: #3a2e30; margin-bottom: 6px; }
        .exp-ex-jp { font-size: 14px; font-weight: 600; color: #d85a7f; margin-bottom: 2px; }
        .exp-ex-vi { font-size: 13px; color: #666; line-height: 1.4; }

        .feedback { display: none; margin-top: 14px; }
        .btn-primary {
            display: block; width: 100%; margin-top: 12px; background: linear-gradient(135deg, #e07a9e 0%, #d85a7f 100%);
            color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center;
        }

        /* Result Screen */
        .result-panel { display: none; text-align: center; padding: 10px 0; }
        .result-icon { font-size: 50px; margin-bottom: 10px; }
        .result-score { font-size: 22px; font-weight: 700; color: #d85a7f; margin-bottom: 8px; }
        .result-msg { font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="sakura-container" id="sakura-box"></div>

    <div class="app-card">
        <!-- Tiêu đề Căn Giữa Dàn Đều -->
        <div class="main-title-block">
            <div class="main-title-sub">SOUMATOME N3</div>
            <div class="main-title-kanji">🌸 KANJI 🌸</div>
        </div>

        <!-- Panel Cài đặt -->
        <div class="setup-panel" id="setup-panel">
            <div style="text-align:center; font-weight:700; color:#b06d7e; font-size:16px;">Tuần 5 ・ Ngày 5–6</div>
            <div class="form-group">
                <label>Số câu mỗi lượt</label>
                <select id="select-count">
                    <option value="10">10 câu</option>
                    <option value="20" selected>20 câu</option>
                    <option value="all">Tất cả (26 câu)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Dạng câu hỏi</label>
                <select id="select-mode">
                    <option value="kanji-to-reading">Kanji ➔ Cách đọc (Hiragana)</option>
                    <option value="reading-to-kanji">Cách đọc (Hiragana) ➔ Kanji</option>
                    <option value="mix" selected>Trộn 2 chiều ngẫu nhiên</option>
                </select>
            </div>
            <button class="btn-primary" onclick="startGame()">Bắt đầu luyện tập ➔</button>
        </div>

        <!-- Panel Làm bài -->
        <div id="game-panel" style="display: none;">
            <div class="header">
                <span id="q-count">Câu 1 / 20</span>
                <span id="score-count">Điểm: 0</span>
            </div>

            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>

            <div class="question-card">
                <div class="q-word" id="q-word">両替</div>
            </div>

            <div class="options-grid" id="options-box"></div>

            <div class="feedback" id="feedback">
                <div id="result-status" style="font-weight: 700; text-align: center; font-size: 15px; margin-bottom: 8px;"></div>
                <div class="explanation-box">
                    <div class="exp-title">📌 Từ vựng & Đáp án chuẩn:</div>
                    <div class="exp-detail" id="exp-detail"></div>
                    <div class="exp-title">🌸 Ví dụ trong sách Soumatome:</div>
                    <div class="exp-ex-jp" id="exp-ex-jp"></div>
                    <div class="exp-ex-vi" id="exp-ex-vi"></div>
                </div>
                <button class="btn-primary" onclick="nextQuestion()">Câu tiếp theo ➔</button>
            </div>
        </div>

        <!-- Panel Kết quả chúc mừng -->
        <div class="result-panel" id="result-panel">
            <div class="result-icon">🎉</div>
            <div style="font-weight: 700; color: #3a2e30; font-size: 18px;">HOÀN THÀNH BÀI HỌC!</div>
            <div class="result-score" id="final-score">0 / 200 ĐIỂM</div>
            <div class="result-msg" id="final-msg">Chúc mừng bạn đã hoàn thành xuất sắc từ vựng Soumatome N3 Tuần 5 Ngày 5–6!</div>
            <button class="btn-primary" onclick="resetSetup()">Luyện tập lại ↺</button>
        </div>
    </div>

    <script>
        function createPetal() {
            const box = document.getElementById('sakura-box');
            if(!box) return;
            const p = document.createElement('div');
            p.classList.add('petal');
            p.style.width = Math.random() * 6 + 6 + 'px';
            p.style.height = Math.random() * 8 + 8 + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = Math.random() * 3 + 5 + 's';
            box.appendChild(p);
            setTimeout(() => p.remove(), 8000);
        }
        setInterval(createPetal, 500);

        // Dữ liệu chuẩn từ Soumatome N3 Kanji Tuần 5 Ngày 5 (Money for Travel) & Ngày 6 (Travel Expenses)
        const rawData = [
            { kanji: "両替", reading: "りょうがえ", hanviet: "LƯỠNG THẾ", meaning: "đổi tiền", exJp: "空港で外貨を円に両替する。", exVi: "Đổi ngoại tệ sang tiền Yên ở sân bay." },
            { kanji: "着替え", reading: "きがえ", hanviet: "TRƯỚC THẾ", meaning: "quần áo thay", exJp: "旅行用に1日分の着替えを用意する。", exVi: "Chuẩn bị 1 bộ quần áo thay cho chuyến du lịch." },
            { kanji: "為替", reading: "かわせ", hanviet: "VI THẾ", meaning: "hối đoái, ngân phiếu", exJp: "外国為替のレートをチェックする。", exVi: "Kiểm tra tỷ giá hối đoái ngoại tệ." },
            { kanji: "着替える", reading: "きがえる", hanviet: "TRƯỚC THẾ", meaning: "thay quần áo", exJp: "部屋に戻って着替える。", exVi: "Trở về phòng và thay quần áo." },
            { kanji: "優先", reading: "ゆうせん", hanviet: "ƯU TIÊN", meaning: "ưu tiên", exJp: "歩行者を優先して運転する。", exVi: "Lái xe nhường ưu tiên cho người đi bộ." },
            { kanji: "優れる", reading: "すぐれる", hanviet: "ƯU", meaning: "xuất sắc, giỏi", exJp: "デザイン性に優れている。", exVi: "Xuất sắc về mặt thiết kế." },
            { kanji: "優しい", reading: "やさしい", hanviet: "ƯU", meaning: "hiền lành, dịu dàng", exJp: "お年寄りに優しい言葉をかける。", exVi: "Nói những lời dịu dàng với người cao tuổi." },
            { kanji: "女優", reading: "じょゆう", hanviet: "NỮ ƯU", meaning: "nữ diễn viên", exJp: "有名な女優が映画に主演する。", exVi: "Nữ diễn viên nổi tiếng đóng vai chính trong phim." },
            { kanji: "俳優", reading: "はいゆう", hanviet: "BÀI ƯU", meaning: "diễn viên", exJp: "舞台俳優の演技を見る。", exVi: "Xem nét diễn của diễn viên kịch." },
            { kanji: "座席", reading: "ざせき", hanviet: "TỌA TỊCH", meaning: "chỗ ngồi, ghế ngồi", exJp: "飛行機の座席を指定する。", exVi: "Đặt chỗ ngồi trên máy bay." },
            { kanji: "正座", reading: "せいざ", hanviet: "CHÍNH TỌA", meaning: "ngồi quỳ (Seiza)", exJp: "畳の上で正座する。", exVi: "Ngồi Seiza trên chiếu Tatami." },
            { kanji: "座る", reading: "すわる", hanviet: "TỌA", meaning: "ngồi", exJp: "空いている席に座る。", exVi: "Ngồi vào chỗ còn trống." },
            { kanji: "降車口", reading: "こうしゃぐち", hanviet: "GIÁNG XA KHẨU", meaning: "cửa xuống xe", exJp: "バスの降車口から降りる。", exVi: "Xuống xe từ cửa xuống của xe buýt." },
            { kanji: "降る", reading: "ふる", hanviet: "GIÁNG", meaning: "rơi (mưa/tuyết)", exJp: "午後から雨が降り出す。", exVi: "Mưa bắt đầu rơi từ chiều." },
            { kanji: "降りる", reading: "おりる", hanviet: "GIÁNG", meaning: "xuống (xe/tàu)", exJp: "次の駅で電車を降りる。", exVi: "Xuống tàu ở ga tiếp theo." },
            { kanji: "以降", reading: "いこう", hanviet: "DĨ HẬU", meaning: "từ sau... trở đi", exJp: "18時以降は割引になる。", exVi: "Được giảm giá từ sau 18 giờ trở đi." },
            { kanji: "学費", reading: "がくひ", hanviet: "HỌC PHÍ", meaning: "học phí", exJp: "大学の学費を自分で払う。", exVi: "Tự mình trả học phí đại học." },
            { kanji: "会費", reading: "かいひ", hanviet: "HỘI PHÍ", meaning: "hội phí", exJp: "パーティーの会費を集める。", exVi: "Thu hội phí của buổi tiệc." },
            { kanji: "旅費", reading: "りょひ", hanviet: "LỮ PHÍ", meaning: "chi phí đi lại, kinh phí du lịch", exJp: "旅費を節約するために早めに予約する。", exVi: "Đặt sớm để tiết kiệm chi phí du lịch." },
            { kanji: "費用", reading: "ひよう", hanviet: "PHÍ DỤNG", meaning: "chi phí", exJp: "修理にかかる費用を見積もる。", exVi: "Báo giá chi phí tốn cho việc sửa chữa." },
            { kanji: "運賃", reading: "うんちん", hanviet: "VẬN NHẪM", meaning: "cước phí vận chuyển / tiền xe", exJp: "電車とバスの運賃を調べる。", exVi: "Tra cước phí xe buýt và tàu điện." },
            { kanji: "賃貸", reading: "ちんたい", hanviet: "NHẪM THẢI", meaning: "cho thuê", exJp: "賃貸マンションを探す。", exVi: "Tìm căn hộ chung cư cho thuê." },
            { kanji: "割増", reading: "わりまし", hanviet: "CÁT TĂNG", meaning: "phụ thu, tính thêm tiền", exJp: "深夜は運賃が割増になる。", exVi: "Tiền xe sẽ phụ thu thêm vào ban đêm." },
            { kanji: "増える", reading: "ふえる", hanviet: "TĂNG", meaning: "tăng lên", exJp: "観光客が年々増えている。", exVi: "Khách du lịch tăng lên hàng năm." },
            { kanji: "割減", reading: "わりげん", hanviet: "CÁT GIẢM", meaning: "giảm bớt tỷ lệ", exJp: "早期予約で割減される。", exVi: "Được giảm giá nhờ đặt sớm." },
            { kanji: "減る", reading: "へる", hanviet: "GIẢM", meaning: "giảm đi", exJp: "費用が大幅に減る。", exVi: "Chi phí giảm đi đáng kể." }
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let canInteract = true;

        function startGame() {
            const countVal = document.getElementById('select-count').value;
            const modeVal = document.getElementById('select-mode').value;

            let list = [...rawData].sort(() => Math.random() - 0.5);
            let selectedCount = countVal === 'all' ? list.length : parseInt(countVal);
            list = list.slice(0, Math.min(selectedCount, list.length));

            currentQuestions = list.map(item => {
                let isKanjiToReading = modeVal === 'kanji-to-reading' ? true :
                                       modeVal === 'reading-to-kanji' ? false :
                                       Math.random() < 0.5;

                return {
                    raw: item,
                    question: isKanjiToReading ? item.kanji : item.reading,
                    answer: isKanjiToReading ? item.reading : item.kanji,
                    isKanjiToReading: isKanjiToReading
                };
            });

            currentIndex = 0;
            score = 0;
            document.getElementById('setup-panel').style.display = 'none';
            document.getElementById('game-panel').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            canInteract = true;
            document.getElementById('feedback').style.display = 'none';
            const item = currentQuestions[currentIndex];

            // Progress Bar & Count
            const progressPercent = ((currentIndex) / currentQuestions.length) * 100;
            document.getElementById('progress-fill').style.width = progressPercent + '%';
            document.getElementById('q-count').innerText = `Câu ${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('score-count').innerText = `Điểm: ${score}`;
            document.getElementById('q-word').innerText = item.question;

            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';

            let options = [item.answer];
            while (options.length < 4) {
                let randItem = rawData[Math.floor(Math.random() * rawData.length)];
                let wrongAns = item.isKanjiToReading ? randItem.reading : randItem.kanji;
                if (!options.includes(wrongAns) && wrongAns !== item.answer) {
                    options.push(wrongAns);
                }
            }
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt === item.answer);
                optionsBox.appendChild(btn);
            });
        }

        function checkAnswer(btn, isCorrect) {
            if (!canInteract) return;
            canInteract = false;

            const item = currentQuestions[currentIndex];
            const statusEl = document.getElementById('result-status');

            if (isCorrect) {
                btn.classList.add('correct');
                score += 10;
                statusEl.innerHTML = `<span style="color: #4caf50;">✓ 正解 (Chính xác!)</span>`;
            } else {
                btn.classList.add('wrong');
                statusEl.innerHTML = `<span style="color: #ef5350;">✕ ざんねん (Đáp án đúng là: ${item.answer})</span>`;
            }

            document.getElementById('exp-detail').innerText = `${item.raw.kanji} 【${item.raw.reading}】 : ${item.raw.meaning} (${item.raw.hanviet})`;
            document.getElementById('exp-ex-jp').innerText = item.raw.exJp;
            document.getElementById('exp-ex-vi').innerText = item.raw.exVi;
            document.getElementById('score-count').innerText = `Điểm: ${score}`;
            document.getElementById('feedback').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            document.getElementById('progress-fill').style.width = '100%';
            document.getElementById('game-panel').style.display = 'none';
            document.getElementById('result-panel').style.display = 'block';
            document.getElementById('final-score').innerText = `${score} / ${currentQuestions.length * 10} ĐIỂM`;
        }

        function resetSetup() {
            document.getElementById('result-panel').style.display = 'none';
            document.getElementById('setup-panel').style.display = 'flex';
        }
    </script>
</body>
</html>
